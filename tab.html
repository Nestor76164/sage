       // Référence au conteneur de notification
const notification = document.getElementById("notification");
const notificationMessage = document.getElementById("notification-message");

// Lecture de la fréquence cardiaque (bpm)
database.ref("BIOMED/bpm").on("value", (snapshot) => {
    const cardiaque = snapshot.val();
    document.getElementById("cardiaque").textContent = cardiaque + " bpm";

    // Vérifie si la fréquence cardiaque est inférieure au seuil
    if (cardiaque < 60) {
        ajouterMessageNotification("- Fréquence cardiaque inférieure à la normale");
    } else {
        retirerMessageNotification("- Fréquence cardiaque inférieure à la normale");
    }
    if (cardiaque > 100) {
        ajouterMessageNotification("- Fréquence cardiaque supérieure à la normale");
    } else {
        retirerMessageNotification("- Fréquence cardiaque supérieure à la normale");
    }
});

// Lecture de la SpO2
database.ref("BIOMED/sp02").on("value", (snapshot) => {
    const spo2 = snapshot.val();
    document.getElementById("spo2").textContent = spo2 + " %";

    // Vérifie si la saturation en oxygène est inférieure au seuil
    if (spo2 < 95) {
        ajouterMessageNotification("- SpO2 inférieur à la normale");
    } else {
        retirerMessageNotification("- SpO2 inférieur à la normale");
    }
    if (spo2 > 100) {
        ajouterMessageNotification("- SpO2 supérieur à la normale");
    } else {
        retirerMessageNotification("- SpO2 supérieur à la normale");
    }
});

// Fonction pour ajouter un message unique à la notification
function ajouterMessageNotification(message) {
    if (!notificationMessage.innerHTML.includes(message)) {
        notificationMessage.innerHTML += message + "<br>";
    }

    // Affiche la notification si elle n'est pas vide
    notification.style.display = "flex";
}

// Fonction pour retirer un message spécifique de la notification
function retirerMessageNotification(message) {
    // Retire le message de la notification
    notificationMessage.innerHTML = notificationMessage.innerHTML.replace(message + "<br>", "");

    // Cache la notification si aucun message n'est présent
    if (notificationMessage.innerHTML.trim() === "") {
        notification.style.display = "none";
    }
}


  // Simulation de la valeur de la pression artérielle
  database.ref("BIOMED/bpm").on("value", (snapshot) => {
    const bpm = snapshot.val();
    let pression;

    if (bpm === 0) {
        pression = "0/0";
        ajouterMessageNotification("- pas de Pression artérielle détectée !");
        retirerMessageNotification("- Hypertension détectée !");
        retirerMessageNotification("- Pression artérielle basse détectée !");
        document.getElementById("pression").textContent = pression + " mmHg";
    } else {
        const systolic = Math.round(70 + bpm / 2);
        const diastolic = Math.round(45 + bpm / 3);
        pression = `${systolic}/${diastolic}`;

        document.getElementById("pression").textContent = pression + " mmHg";

        // Vérifie si systolic et diastolic sont en dessous d'un certain seuil
        if (systolic < 90 && diastolic < 60) {
            // Insérer ici une instruction ou une alerte si la pression est basse
            retirerMessageNotification("- pas de Pression artérielle détectée !");
            ajouterMessageNotification("- Pression artérielle basse détectée !");
            retirerMessageNotification("- Hypertension détectée !");
        } else if (systolic > 120 || diastolic > 90) {
            console.log("Hypertension détectée !");
            // Insérer ici une instruction ou une alerte si la pression est élevée
            ajouterMessageNotification("- Hypertension détectée !");
            retirerMessageNotification("- Pression artérielle basse détectée !");
            retirerMessageNotification("- pas de Pression artérielle détectée !");
        }
        else {
        retirerMessageNotification("- Hypertension détectée !");
        retirerMessageNotification("- Pression artérielle basse détectée !");
        retirerMessageNotification("- pas de Pression artérielle détectée !");
    }
    }

// Fonction pour ouvrir/fermer le menu
document.getElementById('menuToggle').addEventListener("click", function() {
    const menu = document.getElementById("menu");
    // Vérification de l'état actuel du menu (visible ou non)
    if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        menu.classList.add('show');
    } else {
        menu.classList.remove('show');
        menu.classList.add('hidden');
    }
});

// Fonction pour changer de mode clair à sombre
document.getElementById("modeToggle").addEventListener("click", function() {
    const body = document.body;
    // Toggle entre le mode clair et le mode sombre
    if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
    } else {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
    }
});

// Mettre à jour les valeurs toutes les 2 secondes
setInterval(miseAJourValeurs, 2000);
